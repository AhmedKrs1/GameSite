<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/theme.css">
        
    </head>
    <body>
        
            <div class="Heading">
               <h1>Game room</h1> 
               <p> Pick a game and start playing</p>
            </div>
            
            <!-- Profile Menu -->
            <div class="profile-menu">
                <button class="profile-icon" id="profileIconBtn">
                    <img src="css/user.png" alt="Profile">
                </button>
                <div class="profile-dropdown" id="profileDropdown">
                    <a href="login.html">Log In</a>
                    <a href="signup.html">Sign Up</a>
                </div>
            </div>
            <script src="js/index.js"></script>
            <!-- Games grids -->
             <div class="games-grid">
                <!-- Game 1, all the content between the a tags will be elemnt of game1-->
                 <!-- put the icon link, the name of game, the description -->
                <a href="snake.html" class="game-card">
                    <div class="game-icon sudoku">
                        <img src="css/snake.png" alt="Error image">
                    </div>
                    <span class="badge-puzzle"> Puzzle </span>
                    <h2>Snake</h2>
                    <p>Control the snake to eat food and grow longer without hitting the walls or yourself.

                    </p>
                    <button class="play-button">Play Now</button>

                </a>
                <!-- Need to repeat the same for other games -->
                <a href="puzzle.html" class="game-card">
                    <div class="game-icon puzzle">
                        <img src="css/memory.png" alt="Error image">
                    </div>
                    <span class="badge-strategy"> Memory Game </span>
                    <h2>Memory Game</h2>
                    <p>Flip cards to find matching pairs</p>
                    <button class="play-button">Play Now</button>
                </a>
                
                <a href="tic-tac-toe.html" class="game-card">
                    <div class="game-icon ttt">
                        <img src="css/Tic-tac-toe_icon.png" alt="Error image">
                    </div>
                    <span class="badge-casual"> Casual </span>
                    <h2>Tic-tac-toe</h2>
                    <p>Simple and fast. First to get three in a row wins</p>
                    <button class="play-button">Play Now</button>
                </a>
             </div>
        
          
    </body>
   
</html>
