<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-tac-toe</title>
    <link rel="stylesheet" href="css/tic-tac-toe.css">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/tic-tac-toe.js" defer></script>
  </head>
  <body class="body">
    <!-- Backbutton -->
     <a href="../../index.html" class="back-btn">← Back to Hub</a>

     
    <main>
        <h1 class="h1"> Tic-Tac-Toe</h1>
        <div class="scoreboard">
          <div class="score-box">
            <span class="score-label">X wins</span>
            <span class="score-number" id="score-x">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">Draws</span>
            <span class="score-number" id="score-d">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">O wins</span>
            <span class="score-number" id="score-o">0</span>
          </div>
        </div>
      

        <p id="status">X's turn</p>


        <div class="ttt-board" id="board">
            <div class="ttt-cell" data-i="0">c0</div>
            <div class="ttt-cell" data-i="1">c1</div>
            <div class="ttt-cell" data-i="2">c2</div>
            <div class="ttt-cell" data-i="3">c3</div>
            <div class="ttt-cell" data-i="4">c4</div>
            <div class="ttt-cell" data-i="5">c5</div>
            <div class="ttt-cell" data-i="6">c6</div>
            <div class="ttt-cell" data-i="7">c7</div>
            <div class="ttt-cell" data-i="8">c8</div>
        </div>  
    
    
      <button id="reset-btn">Continue</button>
      <button id="score-reset-btn">Reset</button>
    
    
    </main>
  </body>
</html>
