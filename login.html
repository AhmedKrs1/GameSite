<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LogIn</title>
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="css/theme.css">
    </head>
    <body> 
        <form>
        <div class="form-group">
            <label for="loginIdentifier">Username or Email address</label>
           <input type="text" class="form-control" id="loginIdentifier" aria-describedby="identifierHelp">
        <small id="identifierHelp" class="form-text text-muted">Enter your username or email address.</small>
        </div>
        <div class="form-group">
            <label for="InputPassword1">Password</label>
            <input type="password" class="form-control" id="InputPassword1">
        </div>
        <div class="form-group form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <p class="signup-prompt"> Don't have an account? 
            <a href="signup.html">Sign up</a>
       </p>
        </form>
        <!--- Link the javascript file -->
        <script src="js/login.js"></script>

    </body>




</html>
