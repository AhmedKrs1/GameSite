<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Memory Game</title>
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/memory-match.css">   
    </head> 
    <body class="body">
        <a href="index.html" class="back-btn">&larr; Back</a>
        <main>
            <div class="scoreboard">
                <div class="score-box">
                    <span class="score-label">Moves</span>
                    <span class="score-number" id="moves-count">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">Pairs</span>
                    <span class="score-number" id="pairs-count">0</span>
             </div>
            </div>

            <p id="status">Find all matching pairs!</p>
            <div class="memory-board" id="memory-board">
            <!-- Cards will be generated here by JavaScript -->
            </div>
            <button id="reset-btn">New Game</button>
        </main>

        <script src="js/memory-match.js"></script>
    </body>

    
</html>
